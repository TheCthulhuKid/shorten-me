<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shorten-me</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    small { font-weight: normal; opacity: 0.7; }
    input, button { box-sizing: border-box; width: 100%; padding: 0.5rem; font: inherit; }
    button { margin-top: 1.5rem; cursor: pointer; }
    output { display: block; margin-top: 1.5rem; overflow-wrap: anywhere; }
    .error { color: light-dark(#c62828, #ef9a9a); }
  </style>
</head>
<body>
  <h1>shorten-me</h1>
  <form id="shorten">
    <label for="long_url">Long URL</label>
    <input id="long_url" name="long_url" type="url" required placeholder="https://example.com/a/long/path">
    <label for="alias">Alias <small>optional</small></label>
    <input id="alias" name="alias" pattern="[A-Za-z0-9_\-]{3,32}" placeholder="my-link">
    <label for="expires_at">Expires <small>optional, your local time</small></label>
    <input id="expires_at" name="expires_at" type="datetime-local">
    <button>Shorten</button>
  </form>
  <output id="result" for="long_url alias expires_at" aria-live="polite"></output>
  <script>
    const form = document.getElementById("shorten");
    const result = document.getElementById("result");

    function body() {
      const { long_url, alias, expires_at } = Object.fromEntries(new FormData(form));
      return {
        long_url,
        alias: alias || null,
        expires_at: expires_at ? new Date(expires_at).toISOString() : null,
      };
    }

    function errorText(detail) {
      return Array.isArray(detail) ? detail.map((error) => error.msg).join("; ") : detail;
    }

    function showLink(href) {
      result.className = "";
      result.replaceChildren(Object.assign(document.createElement("a"), { href, textContent: href }));
    }

    function showError(text) {
      result.className = "error";
      result.replaceChildren(text);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      let response;
      try {
        response = await fetch(window.location.pathname, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body()),
        });
      } catch {
        showError("Could not reach the service");
        return;
      }
      const data = await response.json().catch(() => ({
        detail: `Request failed with status ${response.status}`,
      }));
      if (response.ok) {
        showLink(data.short_url);
      } else {
        showError(errorText(data.detail));
      }
    });
  </script>
</body>
</html>
